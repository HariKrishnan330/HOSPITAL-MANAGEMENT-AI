<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="MediAI HMS — AI-Powered Hospital Management & Clinical Decision Support System for modern healthcare facilities" />
  <title>MediAI HMS — Hospital Management System</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
  <link rel="stylesheet" href="css/main.css" />
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
  <div id="app">
    <!-- Filled by Router -->
    <div id="page-content" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
      <div style="text-align:center">
        <div class="spinner"></div>
        <p style="margin-top:16px;color:var(--text-muted);font-size:13px">Loading MediAI HMS...</p>
      </div>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>

  <!-- ── Core Modules (load order matters) ── -->
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/router.js"></script>

  <!-- ── Components ── -->
  <script src="js/components/navbar.js"></script>

  <!-- ── Pages ── -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/adminDashboard.js"></script>
  <script src="js/pages/patients.js"></script>
  <script src="js/pages/patientForm.js"></script>
  <script src="js/pages/patientProfile.js"></script>
  <script src="js/pages/nursePanel.js"></script>
  <script src="js/pages/doctorPanel.js"></script>
  <script src="js/pages/aiInsights.js"></script>
  <script src="js/pages/staffManagement.js"></script>
  <script src="js/pages/auditLogs.js"></script>
  <script src="js/pages/operationTimeline.js"></script>

  <!-- ── App Initialization ── -->
  <script>
    (function () {
      /* ----- 1. Initialize database with seed data ----- */
      DB.initialize();

      /* ----- 2. Register all routes ----- */
      Router.register('login', (c) => renderLogin(c));
      Router.register('admin-dashboard', (c) => renderAdminDashboard(c), ['admin', 'doctor', 'nurse']);
      Router.register('patients', (c) => renderPatients(c), ['admin', 'doctor', 'nurse']);
      Router.register('patient-form', (c, p) => renderPatientForm(c, p), ['admin', 'doctor']);
      Router.register('patient-profile', (c, p) => renderPatientProfile(c, p), ['admin', 'doctor', 'nurse']);
      Router.register('nurse-panel', (c) => renderNursePanel(c), ['nurse', 'admin']);
      Router.register('doctor-panel', (c) => renderDoctorPanel(c), ['doctor', 'admin']);
      Router.register('ai-insights', (c) => renderAIInsights(c), ['admin', 'doctor', 'nurse']);
      Router.register('staff-management', (c) => renderStaffManagement(c), ['admin']);
      Router.register('audit-logs', (c) => renderAuditLogs(c), ['admin']);
      Router.register('operation-timeline', (c) => renderOperationTimeline(c), ['admin', 'doctor', 'nurse']);

      /* ----- 3. If already logged in, redirect to role home ----- */
      if (Auth.isLoggedIn() && (!window.location.hash || window.location.hash === '#/' || window.location.hash === '')) {
        const home = { admin: 'admin-dashboard', doctor: 'doctor-panel', nurse: 'nurse-panel' }[Auth.getRole()];
        if (home) { window.location.hash = `#/${home}`; }
      } else if (!window.location.hash || window.location.hash === '#/') {
        window.location.hash = '#/login';
      }

      /* ----- 4. Start router ----- */
      Router.init();

      /* ----- 5. Global keyboard shortcut: Escape to close modal ----- */
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') Utils.closeModal();
      });

      console.log('🏥 MediAI HMS initialized. Version 1.0.0');
      console.log('📋 Demo accounts:', {
        admin: 'admin@hospital.ai / Admin@123',
        doctor: 'doctor@hospital.ai / Doctor@123',
        nurse: 'nurse@hospital.ai / Nurse@123'
      });
    })();
  </script>
</body>

</html>
